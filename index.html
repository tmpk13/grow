<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>grow - pixel plant sampler and growth lab</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230a0d12'/%3E%3Crect x='7' y='7' width='2' height='7' fill='%238a6644'/%3E%3Crect x='4' y='3' width='8' height='4' fill='%237fd1a0'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>grow</h1>
      <div class="find" id="find">
        <input
          id="find-box"
          type="search"
          class="find-box"
          placeholder="Search the menus  /"
          autocomplete="off"
          spellcheck="false"
          aria-label="Search the menus"
        />
        <ul class="find-results" id="find-results" hidden></ul>
      </div>
      <div class="topbar-actions">
        <label
          class="inline"
          id="find-meaning-row"
          for="find-meaning"
          title="Also match settings that mean what you typed, not only ones spelled like it"
        >
          <input id="find-meaning" type="checkbox" />
          <span>Meaning</span>
        </label>
        <span id="save-note" class="save-note"></span>
        <label class="inline" for="ui-scale" title="Size of every label and control">
          <span>Text</span>
          <input id="ui-scale" type="range" min="0.75" max="1.75" step="0.05" />
        </label>
        <button id="btn-undo" class="btn" type="button" title="Undo (ctrl+z)" disabled>Undo</button>
        <button id="btn-redo" class="btn" type="button" title="Redo (ctrl+shift+z)" disabled>Redo</button>
        <button id="btn-panel" class="btn" type="button">Hide menu</button>
        <button id="btn-full" class="btn" type="button" title="Just the world (esc to leave)">
          Fullscreen
        </button>
        <button id="btn-new" class="btn" type="button">New</button>
        <button id="btn-export" class="btn" type="button">Export</button>
        <label class="btn" for="file-import">Import</label>
        <input id="file-import" type="file" accept="application/json" hidden />
        <button id="btn-reset" class="btn danger" type="button">Reset all</button>
      </div>
    </header>

    <main class="layout">
      <aside class="panel">
        <nav class="modes" id="modes"></nav>
        <nav class="tabs" id="tabs"></nav>
        <details class="view-menu" id="view-menu" open>
          <summary>View</summary>
          <div class="view-body" id="view-body"></div>
        </details>
        <div class="panel-body" id="panel-body"></div>
      </aside>

      <section class="stage">
        <div class="stage-toolbar" id="stage-toolbar"></div>
        <div class="stage-canvas-wrap">
          <canvas id="world-canvas"></canvas>
          <!-- The only chrome left in fullscreen, and the way back out if the
               browser refused the request and escape is doing nothing. -->
          <button id="btn-leave-full" class="btn stage-escape" type="button">Leave fullscreen</button>
        </div>
        <div class="statusbar" id="statusbar"></div>
      </section>
    </main>

    <script type="module">
      // The whole application is Rust compiled to WebAssembly; this is the only
      // script on the page, and it does nothing but hand control to it.
      import init from './pkg/grow.js';
      init().catch((err) => {
        document.getElementById('statusbar').textContent = `failed to start: ${err}`;
      });
    </script>
  </body>
</html>
